image: gradle:8.4.0-jdk17-alpine
stages:
  - build
  - test
variables:
  GIT_SSL_NO_VERIFY: "true"
before_script:
  - echo "Start Automated Build"
  - |
    if ($env:CI_RUNNER_TAGS -eq "docker-grupo11") {
      $Env:GRADLE_USER_HOME = "$((Get-Location).Path)/.gradle"
      ./gradlew assemble
      ./gradlew test
      ./gradlew jacocoTestReport
    }
cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches
build:
  stage: build
  script:
    - ./gradlew assemble
  tags:
    - docker-grupo11
  artifacts:
    paths:
      - build/libs/*.jar
test_black_box:
  stage: test
  tags:
    - docker-grupo11
  script:
    - ./gradlew test
  artifacts:
    paths:
      - build/test-results/test/TEST-*.xml
  needs: [build]
test_white_box:
  stage: test
  tags:
    - docker-grupo11
  script:
    - ./gradlew jacocoTestReport
  artifacts:
    paths:
      - build/reports/jacoco*
  needs: [build]
after_script:
  - echo "End Automated Build"