image: gradle:8.4.0-jdk17-alpine
stages:
  - build
  - test 
variables:  
  GIT_SSL_NO_VERIFY: "true"

before_script:
  - echo "Start Automated Build"
  - export GRADLE_USER_HOME='pwd'/.gradle

cache: 
  paths:
    - .gradle/wrapper
    - .gradle/caches 

my_build: 
  stage: build 
  script:
    - gradle assemble 
  tags:
    - docker-runner
  artifacts: 
    paths:
      - build/libs/*.jar 

test_black_box: 
  stage: test
  tags:
    - docker-runner
  script:
    - gradle test
  artifacts: 
    paths:
      - build/test-results/test/TEST-*.xml 
  needs: [my_build]

test_white_box: 
  stage: test
  tags:
    - docker-runner
  script:
    - gradle jacocoTestReport
  artifacts: 
    paths:
      - build/reports/jacoco* 
  needs: [my_build]

after_script:
  - echo "End Automated Build"